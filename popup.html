<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartLens AI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🔍 SmartLens AI</h1>
        <p class="tagline">Multimodal Autonomous Reasoning Agent</p>
      </header>

      <div class="mode-section">
        <h3>Select Mode</h3>
        <div class="mode-buttons">
          <button class="mode-btn" data-mode="auto">🤖 Auto Detect</button>
          <button class="mode-btn" data-mode="grammar">✍️ Grammar</button>
          <button class="mode-btn" data-mode="solve">🧠 Solve Question</button>
          <button class="mode-btn" data-mode="summarize">📝 Summarize</button>
          <button class="mode-btn" data-mode="explain">💡 Explain</button>
        </div>
      </div>

      <div class="action-section">
        <button id="captureBtn" class="primary-btn">
          📸 Capture Screen Area
        </button>
        <button id="analyzeTextBtn" class="secondary-btn">
          📋 Analyze Selected Text
        </button>
        <button id="scanTableBtn" class="table-btn">📊 Scan Data Table</button>
      </div>

      <!-- Table Scanner Section -->
      <div class="table-section" id="tableSection" style="display: none">
        <div class="table-header">
          <h3>📊 Table Scanner</h3>
          <button id="closeTableSection" class="close-section-btn">✕</button>
        </div>
        <div class="table-options">
          <label>Export Format:</label>
          <div class="format-buttons">
            <button class="format-btn active" data-format="json">JSON</button>
            <button class="format-btn" data-format="csv">CSV</button>
            <button class="format-btn" data-format="toml">TOML</button>
            <button class="format-btn" data-format="markdown">Markdown</button>
          </div>
        </div>
        <div class="table-preview" id="tablePreview">
          <p class="empty-state">Click on a table in the page to scan it</p>
        </div>
        <div class="table-actions" id="tableActions" style="display: none">
          <button id="copyTableData" class="action-btn copy">📋 Copy</button>
          <button id="downloadTableData" class="action-btn download">
            💾 Download
          </button>
          <button id="analyzeTableAI" class="action-btn analyze">
            🤖 Analyze with AI
          </button>
        </div>
      </div>

      <!-- History Section -->
      <div class="history-section">
        <div class="history-header">
          <h3>📜 Analysis History</h3>
          <button
            id="clearHistoryBtn"
            class="clear-btn"
            title="Clear all history"
          >
            🗑️ Clear
          </button>
        </div>
        <div id="historyList" class="history-list">
          <p class="empty-state">No analysis history yet</p>
        </div>
      </div>

      <div class="settings-section">
        <h3>🔑 API Configuration</h3>

        <label for="apiPlatform">Select Platform</label>
        <select id="apiPlatform" class="platform-select">
          <option value="openai">OpenAI (GPT-4o)</option>
          <option value="claude">Anthropic Claude</option>
          <option value="gemini">Google Gemini</option>
          <option value="openrouter">OpenRouter</option>
        </select>

        <label for="apiKey">API Key</label>
        <input
          type="password"
          id="apiKey"
          placeholder="Enter API key for selected platform"
        />

        <button id="saveApiKey" class="save-btn">💾 Save API Key</button>

        <div class="saved-keys" id="savedKeys">
          <h4>Saved Platforms</h4>
          <div id="keysList" class="keys-list"></div>
        </div>
      </div>

      <div class="status" id="status"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
